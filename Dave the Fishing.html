{pk+=((bagOpen?1:0)-pk)*Math.min(1,dt*6);lid+=((bagOpen&&pk>.85?1:0)-lid)*Math.min(1,dt*8);const e=pk;pack.position.set(.9*e,1.3-.8*e+Math.sin(e*Math.PI)*.7,-.55+1.55*e);pack.rotation.y=-.5*e;flap.rotation.x=lid*1.9;itm.visible=lid>.3;hero.rotation.x=Math.sin(e*Math.PI)*.4}
